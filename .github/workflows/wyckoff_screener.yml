def get_nifty50_return(smart_api, from_date, to_date):
    """నిఫ్టీ 50 ఇండెక్స్ 6 నెలల రిటర్న్ లెక్కింపు"""
    try:
        historicParam = {
            "exchange": "NSE",
            "symboltoken": "99926000",
            "interval": "ONE_DAY",
            "fromdate": from_date,
            "todate": to_date
        }
        res = smart_api.getCandleData(historicParam)
        if res and res.get('status') and res.get('data'):
            df = pd.DataFrame(res['data'], columns=['date', 'open', 'high', 'low', 'close', 'volume'])
            nifty_close = df['close'].astype(float)
            lookback = min(125, len(nifty_close) - 1)
            nifty_ret = ((nifty_close.iloc[-1] - nifty_close.iloc[-lookback]) / nifty_close.iloc[-lookback]) * 100
            return round(nifty_ret, 1)
    except Exception:
        pass
    return 8.0

def get_nifty500_tokens():
    print("నిఫ్టీ 500 టోకెన్స్ డౌన్‌లోడ్ చేస్తున్నాము...")
    url = "https://margincalculator.angelbroking.com/OpenAPI_File/files/OpenAPIScripMaster.json"
    res = requests.get(url, timeout=30)
    master_data = res.json()

    token_map = {}
    for item in master_data:
        if item.get('exch_seg') == 'NSE' and item.get('symbol', '').endswith('-EQ'):
            sym_name = item['symbol'].replace('-EQ', '')
            token_map[sym_name] = item['token']

    symbols = []
    try:
        n500_url = "https://archives.nseindia.com/content/indices/ind_nifty500list.csv"
        headers = {'User-Agent': 'Mozilla/5.0'}
        resp = requests.get(n500_url, headers=headers, timeout=15)
        if resp.status_code == 200:
            df = pd.read_csv(io.StringIO(resp.text))
            symbols = df['Symbol'].dropna().tolist()
    except Exception:
        pass

    if not symbols:
        symbols = ["RELIANCE", "TCS", "HDFCBANK", "INFY", "ICICIBANK", "SBIN", "BHARTIARTL", "ITC", "LT", "TATASTEEL"]

    valid_stocks = [(sym, token_map[sym]) for sym in symbols if sym in token_map]
    print(f"మొత్తం {len(valid_stocks)} స్టాక్స్ స్కాన్ కోసం సిద్ధంగా ఉన్నాయి.")
    return valid_stocks

def analyze_fundamentals(symbol, current_price, ema20_price):
    """yfinance ద్వారా ఫండమెంటల్స్, సెక్టార్ P/E మరియు కొనుగోలు ధర లెక్కింపు"""
    try:
        ticker = f"{symbol}.NS"
        stock = yf.Ticker(ticker)
        info = stock.info

        roe = info.get("returnOnEquity")
        debt_to_equity = info.get("debtToEquity")
        peg_ratio = info.get("pegRatio")
        pe_ratio = info.get("trailingPE")
        promoter_holding = info.get("heldPercentInsiders")
        fii_holding = info.get("heldPercentInstitutions")
        profit_growth = info.get("earningsGrowth")
        free_cash_flow = info.get("freeCashflow")
        sector = info.get("sector", "General")

        de_ratio = (debt_to_equity / 100.0) if debt_to_equity is not None else None

        # సెక్టార్ P/E మరియు ఫెయిర్ వాల్యూ లెక్కింపు
        sector_pe = SECTOR_PE_BENCHMARKS.get(sector, 24.0)
        valuation_status = "N/A"
        buy_recommendation = f"పుల్‌బ్యాక్ ఎంట్రీ: ₹{ema20_price}"

        if pe_ratio and pe_ratio > 0 and sector_pe:
            pe_diff = round(((pe_ratio - sector_pe) / sector_pe) * 100, 1)
            fair_value_price = round(current_price * (sector_pe / pe_ratio), 1)

            if pe_ratio < sector_pe:
                valuation_status = f"🟢 డిస్కౌంట్ ({abs(pe_diff)}% చౌక)"
                buy_recommendation = f"ప్రస్తుత ధర (₹{current_price}) లేదా పుల్‌బ్యాక్: ₹{ema20_price}"
            elif pe_ratio > sector_pe:
                valuation_status = f"🔴 ప్రీమియం (+{pe_diff}% అధికం)"
                buy_recommendation = f"పుల్‌బ్యాక్ ఎంట్రీ: *₹{ema20_price}* (20 EMA) | ఫెయిర్ వాల్యూ: *~₹{fair_value_price}*"
            else:
                valuation_status = "⚪ ఫెయిర్ వ్యాల్యూ (సమం)"
                buy_recommendation = f"ప్రస్తుత ధర వద్ద కొనుగోలు చేయవచ్చు (సపోర్ట్: ₹{ema20_price})"

        checks = {
            "ROE > 12%": roe is not None and roe >= FUNDAMENTAL_CRITERIA["min_roe"],
            "Debt/Eq < 1.2": de_ratio is not None and de_ratio <= FUNDAMENTAL_CRITERIA["max_debt_to_equity"],
            "PEG < 2.0": peg_ratio is not None and 0 < peg_ratio <= FUNDAMENTAL_CRITERIA["max_peg"],
            "Promoter > 35%": promoter_holding is not None and promoter_holding >= FUNDAMENTAL_CRITERIA["min_promoter"],
            "Profit Growth": profit_growth is not None and profit_growth > 0,
            "Positive FCF": free_cash_flow is not None and free_cash_flow > 0
        }

        score = sum(checks.values())
        total = len(checks)

        is_fundamental_ok = score >= 3

        return {
            "is_fundamental_ok": is_fundamental_ok,
            "score_val": score,
            "score": f"{score}/{total}",
            "roe": f"{round(roe * 100, 1)}%" if roe is not None else "N/A",
            "de": round(de_ratio, 2) if de_ratio is not None else "N/A",
            "peg": round(peg_ratio, 2) if peg_ratio is not None else "N/A",
            "pe": round(pe_ratio, 1) if pe_ratio is not None else "N/A",
            "sector_pe": sector_pe,
            "val_status": valuation_status,
            "buy_advice": buy_recommendation,
            "promoter": f"{round(promoter_holding * 100, 1)}%" if promoter_holding is not None else "N/A",
            "fii": f"{round(fii_holding * 100, 1)}%" if fii_holding is not None else "N/A"
        }
    except Exception:
        return {
            "is_fundamental_ok": True,
            "score_val": 0,
            "score": "N/A",
            "roe": "N/A",
            "de": "N/A",
            "peg": "N/A",
            "pe": "N/A",
            "sector_pe": "N/A",
            "val_status": "N/A",
            "buy_advice": f"పుల్‌బ్యాక్ వద్ద: ₹{ema20_price}",
            "promoter": "N/A",
            "fii": "N/A"
        }

def analyze_stock_advanced(df_daily, nifty_6m_ret):
    if len(df_daily) < 300:
        return None

    d_close = df_daily['close'].astype(float)
    d_volume = df_daily['volume'].astype(float)

    ema20_d = d_close.ewm(span=20, adjust=False).mean()
    ema50_d = d_close.ewm(span=50, adjust=False).mean()
    vol20_avg = d_volume.iloc[-21:-1].mean()

    curr_d_close = d_close.iloc[-1]
    curr_d_vol = d_volume.iloc[-1]
    vol_boost = round(curr_d_vol / max(vol20_avg, 1), 2)
    ema20_val = round(ema20_d.iloc[-1], 2)

    if curr_d_close > ema20_d.iloc[-1] and curr_d_close > ema50_d.iloc[-1]:
        daily_trigger = "✅ సూపర్ బుల్లిష్ (20 & 50 EMA పైన)"
        is_daily_ok = True
    elif curr_d_close < ema50_d.iloc[-1]:
        daily_trigger = "⏳ డైలీ కరెక్షన్ (50 EMA క్రింద)"
        is_daily_ok = False
    else:
        daily_trigger = "⚠️ కన్సాలిడేషన్ (EMAల మధ్య)"
        is_daily_ok = False

    lookback_d = min(125, len(d_close) - 1)
    stock_6m_ret = ((curr_d_close - d_close.iloc[-lookback_d]) / d_close.iloc[-lookback_d]) * 100
    alpha = round(stock_6m_ret - nifty_6m_ret, 1)

    if alpha >= 15:
        rs_text = f"+{alpha}% (ఆల్ఫా లీడర్)"
    elif alpha > 0:
        rs_text = f"+{alpha}%"
    else:
        rs_text = f"{alpha}%"

    df_m = df_daily.copy()
    df_m['date'] = pd.to_datetime(df_m['date'])
    df_m.set_index('date', inplace=True)
    monthly_df = df_m.resample('ME').agg({
        'open': 'first',
        'high': 'max',
        'low': 'min',
        'close': 'last',
        'volume': 'sum'
    }).dropna()

    if len(monthly_df) < 30:
        return None

    m_close = monthly_df['close'].astype(float)
    m_high = monthly_df['high'].astype(float)
    m_low = monthly_df['low'].astype(float)

    exp12 = m_close.ewm(span=12, adjust=False).mean()
    exp26 = m_close.ewm(span=26, adjust=False).mean()
    macd = exp12 - exp26
    signal = macd.ewm(span=9, adjust=False).mean()

    curr_macd = macd.iloc[-1]
    curr_sig = signal.iloc[-1]
    is_macd_bullish = curr_macd > curr_sig

    high_2year = m_high.iloc[-25:-1].max()
    high_15m = m_high.iloc[-16:-1].max()
    low_15m = m_low.iloc[-16:-1].min()

    curr_m_close = m_close.iloc[-1]
    curr_m_low = m_low.iloc[-1]

    wyckoff_stage = None

    if curr_m_close >= high_2year:
        wyckoff_stage = "Phase E (2 ఏళ్ల గరిష్ట బ్రేక్‌అవుట్)"
    elif curr_m_close >= (0.97 * high_15m) and curr_m_close <= (1.05 * high_15m):
        wyckoff_stage = "Phase D (బ్రేక్‌అవుట్‌కు సిద్ధం)"
    elif curr_m_low < low_15m and curr_m_close > low_15m:
        wyckoff_stage = "Phase C (స్ప్రింగ్ బాటమ్ రివర్సల్)"

    if wyckoff_stage and is_macd_bullish:
        return {
            "price": round(curr_d_close, 2),
            "ema20": ema20_val,
            "stage": wyckoff_stage,
            "daily_trigger": daily_trigger,
            "rs": rs_text,
            "vol_boost": vol_boost,
            "alpha_val": alpha,
            "is_super_bullish": is_daily_ok
        }

    return None

