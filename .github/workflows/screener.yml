name: NSE టాప్ 2000 డైలీ బాటమ్ MACD స్క్రీనర్

on:
  schedule:
    # సోమవారం నుండి శుక్రవారం వరకు ప్రతిరోజూ రాత్రి 7:30 PM IST (14:00 UTC) కి రన్ అవుతుంది
    - cron: '0 14 * * 1-5'
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: కోడ్ చెకౌట్
        uses: actions/checkout@v4

      - name: పైథాన్ 3.10 ఇన్‌స్టాలేషన్
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: చార్ట్ ఫాంట్స్ ఇన్‌స్టాలేషన్
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-deva

      - name: అవసరమైన పైథాన్ లైబ్రరీల ఇన్‌స్టాలేషన్
        run: |
          python -m pip install --upgrade pip
          pip install smartapi-python pyotp pandas numpy requests matplotlib beautifulsoup4

      - name: డైలీ బాటమ్ MACD స్క్రీనర్ రన్ చేయడం
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_KEY: ${{ secrets.ANGEL_TOTP_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: |
          python - << 'EOF'
          import os
          import io
          import time
          import smtplib
          import requests
          import pyotp
          import numpy as np
          import pandas as pd
          import matplotlib
          matplotlib.use('Agg')
          import matplotlib.pyplot as plt
          from bs4 import BeautifulSoup
          from datetime import datetime, timedelta
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from email.mime.image import MIMEImage
          from SmartApi import SmartConnect

          # --- GitHub Secrets నుండి ఆధారాలు ---
          API_KEY = os.getenv("ANGEL_API_KEY")
          CLIENT_CODE = os.getenv("ANGEL_CLIENT_CODE")
          PIN = os.getenv("ANGEL_PIN")
          TOTP_KEY = os.getenv("ANGEL_TOTP_KEY")

          GMAIL_USER = os.getenv("GMAIL_USER")
          GMAIL_APP_PASS = os.getenv("GMAIL_APP_PASS")
          EMAIL_RECEIVER = os.getenv("EMAIL_RECEIVER")

          FUNDAMENTAL_CRITERIA = {
              "min_roe": 12.0,            # 12% కంటే ఎక్కువ
              "max_debt_to_equity": 1.2,   # 1.2 కంటే తక్కువ
              "max_peg": 2.0,              # 2.0 కంటే తక్కువ
              "min_promoter": 35.0,        # 35% కంటే ఎక్కువ
          }

          SECTOR_PE_BENCHMARKS = {
              "Technology": 28.0,
              "Financial Services": 18.0,
              "Healthcare": 32.0,
              "Consumer Defensive": 42.0,
              "Consumer Cyclical": 38.0,
              "Energy": 14.0,
              "Industrials": 32.0,
              "Basic Materials": 16.0,
              "Communication Services": 26.0,
              "Utilities": 15.0,
              "Real Estate": 25.0
          }

          session = requests.Session()

          def send_gmail_report(subject, html_body, images=None):
              if not GMAIL_USER or not GMAIL_APP_PASS or not EMAIL_RECEIVER:
                  print("Gmail సీక్రెట్స్ GitHub లో సరిగ్గా కాన్ఫిగర్ కాలేదు.")
                  return

              msg = MIMEMultipart('related')
              msg['Subject'] = subject
              msg['From'] = GMAIL_USER
              msg['To'] = EMAIL_RECEIVER

              alt_part = MIMEMultipart('alternative')
              msg.attach(alt_part)

              html_part = MIMEText(html_body, 'html')
              alt_part.attach(html_part)

              # చార్ట్ ఇమేజ్‌లను ఈమెయిల్‌లో ఇన్‌లైన్‌గా జతచేయడం
              if images:
                  for cid, img_bytes in images.items():
                      img_mime = MIMEImage(img_bytes)
                      img_mime.add_header('Content-ID', f'<{cid}>')
                      img_mime.add_header('Content-Disposition', 'inline', filename=f"{cid}.png")
                      msg.attach(img_mime)

              try:
                  with smtplib.SMTP_SSL("smtp.gmail.com", 465) as server:
                      server.login(GMAIL_USER, GMAIL_APP_PASS)
                      server.send_message(msg)
                  print("Gmail ఈమెయిల్ విజయవంతంగా పంపబడింది.")
              except Exception as e:
                  print(f"Gmail పంపడంలో లోపం: {e}")

          def get_fear_and_greed():
              try:
                  url = "https://api.tickertape.in/mmi/now"
                  headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
                  res = session.get(url, headers=headers, timeout=5)
                  if res.status_code == 200:
                      val = round(res.json().get('data', 50.0), 1)
                      if val < 30:
                          return f"🟢 <b>Fear & Greed:</b> {val} (ఎక్స్‌ట్రీమ్ ఫియర్ - కొనుగోలుకు అనుకూలం)"
                      elif val < 50:
                          return f"🟢 <b>Fear & Greed:</b> {val} (ఫియర్ జోన్)"
                      elif val <= 70:
                          return f"🔴 <b>Fear & Greed:</b> {val} (గ్రీడ్ జోన్)"
                      else:
                          return f"🔴 <b>Fear & Greed:</b> {val} (ఎక్స్‌ట్రీమ్ గ్రీడ్ - జాగ్రత్త)"
              except Exception as e:
                  print(f"MMI ఎర్రర్: {e}")
              return "⚪ <b>Fear & Greed:</b> N/A"

          def get_angel_session():
              if not all([API_KEY, CLIENT_CODE, PIN, TOTP_KEY]):
                  print("ఏంజెల్ వన్ సీక్రెట్స్ సరిగ్గా కాన్ఫిగర్ కాలేదు.")
                  return None
              try:
                  smart_api = SmartConnect(api_key=API_KEY)
                  totp = pyotp.TOTP(TOTP_KEY).now()
                  data = smart_api.generateSession(CLIENT_CODE, PIN, totp)
                  if data and data.get('status'):
                      print("ఏంజెల్ వన్ లాగిన్ విజయవంతమైంది.")
                      return smart_api
                  else:
                      err = data.get('message') if data else 'నో రెస్పాన్స్'
                      print(f"లాగిన్ విఫలమైంది: {err}")
                      return None
              except Exception as e:
                  print(f"SmartAPI కనెక్ట్ లోపం: {e}")
                  return None

          def get_top_2000_stocks():
              print("NSE మాస్టర్ నుండి స్టాక్స్ డౌన్‌లోడ్ అవుతున్నాయి...")
              master_url = "https://margincalculator.angelbroking.com/OpenAPI_File/files/OpenAPIScripMaster.json"
              master_data = None
              for attempt in range(1, 4):
                  try:
                      res = session.get(master_url, timeout=60)
                      if res.status_code == 200:
                          master_data = res.json()
                          break
                  except Exception as e:
                      print(f"ప్రయత్నం {attempt} లోపం: {e}")
                      time.sleep(3)

              if not master_data:
                  return []

              valid_stocks = []
              seen_symbols = set()
              for item in master_data:
                  if item.get('exch_seg') == 'NSE' and item.get('symbol', '').endswith('-EQ'):
                      sym = item['symbol'].replace('-EQ', '').strip()
                      token = item['token']
                      if sym not in seen_symbols and not sym.endswith('-BE') and not sym.endswith('-BZ'):
                          seen_symbols.add(sym)
                          valid_stocks.append((sym, token))

              return valid_stocks[:2000]

          def parse_val(text):
              if not text or text == 'None':
                  return None
              cleaned = text.replace(',', '').replace('%', '').replace('₹', '').strip()
              try:
                  return float(cleaned)
              except ValueError:
                  return None

          def analyze_fundamentals(symbol, current_price, ema20_price):
              try:
                  headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
                  url = f"https://www.screener.in/company/{symbol}/consolidated/"
                  resp = session.get(url, headers=headers, timeout=6)
                  if resp.status_code != 200:
                      url = f"https://www.screener.in/company/{symbol}/"
                      resp = session.get(url, headers=headers, timeout=6)
                      if resp.status_code != 200:
                          return None

                  soup = BeautifulSoup(resp.text, 'html.parser')

                  about_div = soup.find('div', class_='about')
                  biz_info = "కంపెనీ ప్రధాన ఉత్పత్తులు & సేవల వ్యాపారంలో ఉంది."
                  if about_div:
                      p_tag = about_div.find('p')
                      if p_tag:
                          full_about = p_tag.text.strip().replace('\n', ' ')
                          biz_info = (full_about[:200] + '...') if len(full_about) > 200 else full_about

                  ratios = {}
                  for li in soup.find_all('li', class_='flex flex-space-between'):
                      name_elem = li.find('span', class_='name')
                      val_elem = li.find('span', class_='nowrap value')
                      if name_elem and val_elem:
                          ratios[name_elem.text.strip()] = val_elem.text.strip()

                  # బిజినెస్ క్యాపిటల్ (Market Cap)
                  mcap = parse_val(ratios.get('Market Cap'))
                  if mcap is not None:
                      if mcap >= 20000:
                          cap_category = "లార్జ్ క్యాప్ (Large Cap - అతి సురక్షితం)"
                      elif mcap >= 5000:
                          cap_category = "మిడ్ క్యాప్ (Mid Cap - మంచి వృద్ధి)"
                      elif mcap >= 500:
                          cap_category = "స్మాల్ క్యాప్ (Small Cap - అధిక రాబడి/రిస్క్)"
                      else:
                          cap_category = "మైక్రో క్యాప్ (Micro Cap - హై రిస్క్)"
                      mcap_text = f"₹{mcap:,.0f} Cr ({cap_category})"
                  else:
                      mcap_text = "వివరాలు అందుబాటులో లేవు"

                  roe_raw = ratios.get('ROE') or ratios.get('Return on equity')
                  if not roe_raw:
                      for li in soup.find_all('li'):
                          text_content = li.text.strip()
                          if 'ROE' in text_content or 'Return on equity' in text_content:
                              val_span = li.find('span', class_='nowrap value') or li.find('span', class_='number')
                              if val_span:
                                  roe_raw = val_span.text.strip()
                                  break

                  roe = parse_val(roe_raw)
                  pe_ratio = parse_val(ratios.get('Stock P/E'))
                  de_ratio = parse_val(ratios.get('Debt to equity'))
                  if de_ratio is None:
                      de_ratio = 0.0

                  promoter_holding = None
                  promoter_pledge = 0.0
                  fii_holding = None
                  peg_ratio = None
                  free_cash_flow = None
                  profit_growth = None

                  sh_section = soup.find('section', id='shareholding')
                  if sh_section:
                      for tr in sh_section.find_all('tr'):
                          row_name = tr.text.strip()
                          cells = tr.find_all('td')
                          if 'Promoters' in row_name and cells:
                              promoter_holding = parse_val(cells[-1].text)
                          elif 'Pledged' in row_name and cells:
                              pval = parse_val(cells[-1].text)
                              if pval is not None:
                                  promoter_pledge = pval
                          elif 'FIIs' in row_name and cells:
                              fii_holding = parse_val(cells[-1].text)

                  cf_section = soup.find('section', id='cash-flow')
                  if cf_section:
                      for tr in cf_section.find_all('tr'):
                          if 'Cash from Operating Activity' in tr.text:
                              cells = tr.find_all('td')
                              if cells:
                                  val = parse_val(cells[-1].text)
                                  free_cash_flow = (val > 0) if val is not None else True

                  pl_section = soup.find('section', id='profit-loss')
                  if pl_section:
                      for tr in pl_section.find_all('tr'):
                          if 'Net Profit' in tr.text:
                              cells = tr.find_all('td')
                              if len(cells) >= 2:
                                  curr_p = parse_val(cells[-1].text)
                                  prev_p = parse_val(cells[-2].text)
                                  if curr_p is not None and prev_p is not None:
                                      profit_growth = (curr_p >= prev_p)
                                      growth_rate = ((curr_p - prev_p) / abs(prev_p)) * 100 if prev_p != 0 else 0
                                      if growth_rate > 0 and pe_ratio:
                                          peg_ratio = round(pe_ratio / growth_rate, 2)

                  sector = "General"
                  sector_pe = SECTOR_PE_BENCHMARKS.get(sector, 25.0)

                  if not pe_ratio or pe_ratio <= 0:
                      return None

                  is_pe_discounted = (pe_ratio < sector_pe)
                  pe_color = "🟢" if is_pe_discounted else "🔴"
                  if not is_pe_discounted:
                      return None

                  pe_diff = round(((sector_pe - pe_ratio) / sector_pe) * 100, 1)
                  valuation_status = f"🟢 <b>డిస్కౌంట్ లో దొరుకుతుంది ({pe_diff}% చౌక)</b>"
                  buy_recommendation = f"ప్రస్తుత ధర వద్ద: ₹{current_price} (సపోర్ట్: ₹{ema20_price})"

                  fii_color = "🟢" if (fii_holding and fii_holding >= 10.0) else "🔴"
                  fii_text = f"{fii_holding}%" if fii_holding is not None else "N/A"

                  c_roe = (roe is not None and roe >= FUNDAMENTAL_CRITERIA["min_roe"])
                  c_de = (de_ratio is not None and de_ratio <= FUNDAMENTAL_CRITERIA["max_debt_to_equity"])
                  c_peg = (peg_ratio is not None and 0 < peg_ratio <= FUNDAMENTAL_CRITERIA["max_peg"])
                  c_prom = (promoter_holding is not None and promoter_holding >= FUNDAMENTAL_CRITERIA["min_promoter"])
                  c_profit = (profit_growth is not False)
                  c_fcf = (free_cash_flow is not False)

                  score = sum([c_roe, c_de, c_peg, c_prom, c_profit, c_fcf])

                  roe_desc = f"ఈ కంపెనీ షేర్ మీద ఏడాదికి {roe}% లాభం సంపాదిస్తోంది" if roe else "లాభాల శాతం అందుబాటులో లేదు"
                  de_desc = "కంపెనీకి అప్పుల భారం లేదు (చాలా సురక్షితం)" if (de_ratio is not None and de_ratio <= 1.2) else "కంపెనీకి అప్పుల భారం ఎక్కువగా ఉంది"
                  peg_desc = "లాభాల పెరుగుదలకు తగిన సరసమైన ధరలో ఉంది" if (peg_ratio and peg_ratio <= 2.0) else "లాభాల పెరుగుదల కంటే ప్రస్తుత షేరు ధర కాస్త ఎక్కువగా ఉంది"
                  fcf_desc = "ఖర్చులు పోను కంపెనీ చేతిలో నికర నగదు మిగులుతోంది" if c_fcf else "కంపెనీ చేతిలో ఖర్చులు పోను నికర నగదు మిగలడం లేదు"
                  profit_desc = "గతంతో పోలిస్తే కంపెనీ నికర లాభాలు పెరుగుతున్నాయి" if c_profit else "గతంతో పోలిస్తే కంపెనీ నికర లాభాలు తగ్గుతున్నాయి"
                  pe_desc = f"సెక్టార్ కంటే ఈ షేరు {pe_diff}% తక్కువ ధరకు (చౌకగా) లభిస్తోంది"
                  promoter_desc = f"కంపెనీ యజమానుల వద్దే {promoter_holding}% వాటా ఉంది" if promoter_holding else "యజమానుల వాటా వివరాలు లేవు"

                  if promoter_pledge > 0:
                      pledge_text = f"⚠️ <b>తాకట్టు:</b> {promoter_pledge}% షేర్లు తాకట్టులో ఉన్నాయి"
                  else:
                      pledge_text = "🔒 <b>తాకట్టు:</b> 0.0% (ఒక్క షేరు కూడా తాకట్టు పెట్టలేదు, చాలా సురక్షితం)"

                  risk_note = ""
                  if not c_profit:
                      risk_note = (
                          "<div style='background: #fff3cd; padding: 10px; border-left: 4px solid #ffc107; margin-top: 10px;'>"
                          "<b>ℹ️ 🔴 నెగెటివ్ ప్రాఫిట్ గ్రోత్ ఉన్నా ఎందుకు కొనవచ్చు:</b><br>"
                          "• కంపెనీకి అప్పుల భారం లేదు (D/E &lt; 1.2) & క్యాష్ ఫ్లో బలంగా ఉంది.<br>"
                          "• లాభాలు తగ్గడం వల్లనే షేరు డిస్కౌంట్ ధరకు లభిస్తోంది.<br>"
                          "• డైలీ బాటమ్ MACD రివర్సల్ ఉన్నందున సపోర్ట్ వద్ద ఎంట్రీ పరిశీలించవచ్చు."
                          "</div>"
                      )

                  return {
                      "is_discounted": True,
                      "score_val": score,
                      "pe_diff": pe_diff,
                      "score_text": f"{score}/6",
                      "roe": roe,
                      "de_ratio": de_ratio,
                      "peg_ratio": peg_ratio,
                      "c_roe": c_roe,
                      "c_de": c_de,
                      "c_peg": c_peg,
                      "c_fcf": c_fcf,
                      "c_profit": c_profit,
                      "c_prom": c_prom,
                      "pe_color": pe_color,
                      "pe_ratio": pe_ratio,
                      "sector_pe": sector_pe,
                      "promoter_holding": promoter_holding,
                      "roe_desc": roe_desc,
                      "de_desc": de_desc,
                      "peg_desc": peg_desc,
                      "fcf_desc": fcf_desc,
                      "profit_desc": profit_desc,
                      "pe_desc": pe_desc,
                      "promoter_desc": promoter_desc,
                      "pledge_text": pledge_text,
                      "risk_note": risk_note,
                      "fii_line": f"🔴 <b>FII హోల్డింగ్:</b> {fii_text}" if fii_color == "🔴" else f"🟢 <b>FII హోల్డింగ్:</b> {fii_text}",
                      "val_status": valuation_status,
                      "buy_advice": buy_recommendation,
                      "business_model": biz_info,
                      "mcap_text": mcap_text
                  }
              except Exception as e:
                  return None

          def get_color_coded_macd(series, fast=12, slow=26, signal_span=9):
              exp12 = series.ewm(span=fast, adjust=False).mean()
              exp26 = series.ewm(span=slow, adjust=False).mean()
              macd = exp12 - exp26
              signal = macd.ewm(span=signal_span, adjust=False).mean()

              if len(macd) < 3:
                  return "⚪ డేటా లేదు", False, False

              curr_m = round(macd.iloc[-1], 2)
              curr_s = round(signal.iloc[-1], 2)
              prev_m = round(macd.iloc[-2], 2)
              prev_s = round(signal.iloc[-2], 2)

              gap = round(curr_m - curr_s, 2)
              abs_gap = abs(gap)
              is_below_zero = (curr_m < 0.0)

              is_crossed = (curr_m > curr_s)
              is_fresh = (prev_m <= prev_s) and is_crossed and is_below_zero

              if is_crossed:
                  color_text = "🟢 క్రాస్ అయ్యింది"
              elif abs_gap <= 0.06 or (abs(curr_s) > 0 and (abs_gap / abs(curr_s)) <= 0.02):
                  color_text = "⚫ ఇప్పుడే కలిసాయి"
              elif abs_gap <= 0.35 or (abs(curr_s) > 0 and (abs_gap / abs(curr_s)) <= 0.08):
                  color_text = "🔵 ఇంకాస్త దగ్గరగా ఉన్నది"
              elif abs_gap <= 0.90 or (abs(curr_s) > 0 and (abs_gap / abs(curr_s)) <= 0.22):
                  color_text = "🟡 క్రాస్ కావడానికి దగ్గరగా ఉన్నది"
              else:
                  color_text = "🔴 ఇంకా దూరంగా ఉంది"

              return color_text, is_fresh, is_crossed

          def generate_live_chart_image(df_d, sym):
              df_plot = df_d.iloc[-70:].copy()

              exp12 = df_plot['close'].ewm(span=12, adjust=False).mean()
              exp26 = df_plot['close'].ewm(span=26, adjust=False).mean()
              macd = exp12 - exp26
              signal = macd.ewm(span=9, adjust=False).mean()
              hist = macd - signal

              fig, (ax1, ax2) = plt.subplots(2, 1, figsize=(9, 6), gridspec_kw={'height_ratios': [2, 1.2]}, sharex=True)
              plt.subplots_adjust(hspace=0.08)

              ax1.plot(df_plot.index, df_plot['close'], color='#007acc', linewidth=1.8, label='Price')
              ax1.plot(df_plot.index, df_plot['close'].ewm(span=20).mean(), color='#e67e22', linestyle='--', linewidth=1.2, label='20 EMA')
              ax1.set_title(f"{sym} - Daily Bottom Reversal & MACD Chart", fontsize=12, fontweight='bold', pad=10)
              ax1.grid(True, linestyle=':', alpha=0.6)
              ax1.legend(loc='upper left', fontsize=9)

              ax2.plot(df_plot.index, macd, color='#1e88e5', linewidth=2.0, label='MACD Line (Blue)')
              ax2.plot(df_plot.index, signal, color='#e53935', linewidth=1.6, label='Signal Line (Red)')

              colors = ['#26a69a' if h >= 0 else '#ef5350' for h in hist]
              ax2.bar(df_plot.index, hist, color=colors, alpha=0.5, width=0.8)

              ax2.axhline(0.0, color='black', linestyle='--', linewidth=1.2, alpha=0.8, label='Zero Line (0.00)')
              ax2.grid(True, linestyle=':', alpha=0.6)
              ax2.legend(loc='lower left', fontsize=8)

              curr_m = round(macd.iloc[-1], 2)
              curr_s = round(signal.iloc[-1], 2)
              diff = round(curr_m - curr_s, 2)
              gap_text = f"Gap: +{diff}" if diff >= 0 else f"Gap: {diff}"
              ax2.set_ylabel(f"MACD ({curr_m}/{curr_s})\n{gap_text}", fontsize=8)

              buf = io.BytesIO()
              plt.savefig(buf, format='png', dpi=120, bbox_inches='tight')
              plt.close(fig)
              buf.seek(0)
              return buf.getvalue()

          def analyze_stock_daily(smart_api, token, from_date_daily, to_date):
              param_daily = {
                  "exchange": "NSE",
                  "symboltoken": str(token),
                  "interval": "ONE_DAY",
                  "fromdate": from_date_daily,
                  "todate": to_date
              }
              try:
                  res_d = smart_api.getCandleData(param_daily)
              except Exception:
                  return None

              if not res_d or not res_d.get('status') or not res_d.get('data') or len(res_d['data']) < 220:
                  return None

              df_d = pd.DataFrame(res_d['data'], columns=['date', 'open', 'high', 'low', 'close', 'volume'])
              df_d['date'] = pd.to_datetime(df_d['date'])
              df_d.set_index('date', inplace=True)
              df_d['close'] = df_d['close'].astype(float)
              df_d['open'] = df_d['open'].astype(float)
              df_d['volume'] = df_d['volume'].astype(float)

              curr_close = df_d['close'].iloc[-1]
              curr_open = df_d['open'].iloc[-1]
              curr_vol = df_d['volume'].iloc[-1]

              if curr_close < curr_open:
                  return None

              if len(df_d['volume']) < 22:
                  return None

              vol20_avg = df_d['volume'].iloc[-21:-1].mean()
              if pd.isna(vol20_avg) or vol20_avg <= 0:
                  return None

              vol_boost = round(curr_vol / vol20_avg, 2)
              if vol_boost < 1.1:
                  return None

              stat_1d, d_fresh, d_bull = get_color_coded_macd(df_d['close'])

              if "🔴" in stat_1d:
                  return None

              ema20 = df_d['close'].ewm(span=20, adjust=False).mean().iloc[-1]

              return {
                  "price": round(curr_close, 2),
                  "vol_boost": vol_boost,
                  "ema20": round(ema20, 2),
                  "stat_1d": stat_1d,
                  "is_daily_fresh": d_fresh,
                  "df_daily": df_d
              }

